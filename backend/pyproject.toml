[project]
name = "tally-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tally-contract",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "alembic",
  "psycopg[binary]",
  "pyyaml",
  "packaging",
  "pyjwt>=2.14.0",
  "bcrypt>=5.0.0",
  "apscheduler>=3.10,<4",
  # PDF exports (P14.7). Needs pango on the host: brew install pango / libpango in Docker.
  "weasyprint>=62",
  # The optional anomaly module only (P15). Imported nowhere else: an import-linter contract
  # keeps them inside app.anomaly, and nothing imports app.anomaly while the feature flag is off.
  "anthropic>=1.8",
  "mcp>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
