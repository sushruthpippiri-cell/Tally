[project]
name = "tally-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tally-contract",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "alembic",
  "psycopg[binary]",
  "pyyaml",
  "packaging",
  "pyjwt>=2.14.0",
  "bcrypt>=5.0.0",
  "apscheduler>=3.10,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
