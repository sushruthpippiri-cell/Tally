[project]
name = "tally-agent"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
# No FastAPI/SQLAlchemy: ships to Windows machines.
dependencies = [
  "tally-contract",
  "typer",
  "httpx",
  "certifi",
  "psutil",
  "pywin32; sys_platform == 'win32'",  # DPAPI, ACLs, the Windows service (D-042)
]

[project.scripts]
tally-agent = "tally_agent.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tally_agent"]
