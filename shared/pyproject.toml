[project]
name = "tally-contract"
version = "0.0.0"
description = "Agent<->backend contract: records, XML request builder, parser, normalization, error codes"
requires-python = ">=3.12,<3.13"
# No FastAPI/SQLAlchemy here: the Agent ships to Windows machines (P0.1).
dependencies = ["pydantic>=2", "structlog"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tally_contract"]
