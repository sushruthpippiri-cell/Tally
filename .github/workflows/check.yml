name: check

# Linux, on every push. The Windows jobs live in their own workflows (agent-windows.yml,
# capture-kit.yml) with path filters: Windows minutes cost twice as much (D-038 #7).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on 2026-10-19 and would change
    # the runner's tool versions mid-phase. Upgrade deliberately.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: postgres_dev
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag past v7, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # poppler: the SRS transcription tests, and pdftotext/pdffonts in the export tests.
      # Pango: WeasyPrint. No font package - the PDF's fonts are bundled (D-053 #7b).
      - name: Install poppler and Pango
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libpango-1.0-0 libpangoft2-1.0-0
      - name: Create roles and databases
        run: |
          for f in deploy/postgres/init/*.sh; do
            POSTGRES_USER=postgres TALLY_OWNER_PASSWORD=tally_owner_dev \
            TALLY_APP_PASSWORD=tally_app_dev PGHOST=localhost bash "$f"
          done
      - run: uv sync --all-packages
      - run: make lint
      - run: make typecheck
      - run: make importlint
      - run: make migrate
      - run: make test PHASE=ci
      - run: make traceability
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs
          path: logs/test-runs/

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run gen:api:check  # the committed types match the committed OpenAPI document
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: |
            logs/e2e/
            logs/e2e-report/
