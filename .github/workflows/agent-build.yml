name: agent-build

# The Windows Agent's x64 build (D-043 #3): PyInstaller one-folder app with tally-agent.exe and
# tally-agent-service.exe, the TDL files, the install scripts and docs/agent-install.md.
# Manual only (Windows minutes, D-038 #7): Actions -> agent-build -> Run workflow, or
# `gh workflow run agent-build.yml`. The zip is the artifact `tally-agent-windows-x64`.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # x64: what customers' PCs run
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --group build
      - run: uv run pytest agent -q
      - run: uv run pyinstaller agent/packaging/tally-agent.spec --noconfirm --distpath dist --workpath build
      - name: Add the TDL files, install scripts and guide next to the executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\TallyAgent\tdl | Out-Null
          Copy-Item tdl\TallyAnalytics.tdl, tdl\TA_Minimal.tdl dist\TallyAgent\tdl\
          Copy-Item agent\packaging\Install-TallyAgent.ps1, agent\packaging\Uninstall-TallyAgent.ps1 dist\TallyAgent\
          Copy-Item docs\agent-install.md dist\TallyAgent\
      - name: Smoke test the build
        shell: pwsh
        run: |
          .\dist\TallyAgent\tally-agent.exe --help
          if ($LASTEXITCODE -ne 0) { throw "tally-agent.exe --help failed" }
          foreach ($f in "tally-agent-service.exe", "Install-TallyAgent.ps1", "Uninstall-TallyAgent.ps1", "agent-install.md", "tdl\TallyAnalytics.tdl") {
            if (-not (Test-Path "dist\TallyAgent\$f")) { throw "missing $f" }
          }
      # P16.8: the installer is COMPILED here, which is the only part of it that can be
      # verified without a Windows machine to install on. Compiling catches a mistyped
      # directive, a missing source file and a Pascal-script error - the three things that
      # would otherwise be found by the owner, on the real PC, with nothing to fall back on.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: |
          $version = "0.1.0"
          # ${env:ProgramFiles(x86)}, not "$env:ProgramFiles(x86)": the second interpolates
          # $env:ProgramFiles and leaves a literal "(x86)", losing the space - which is how the
          # first real run of this step failed, before ISCC was reached at all.
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\TallyAgent" "/O$PWD\dist" `
            agent\packaging\TallyAgent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $setup = "dist\TallyAgent-Setup-0.1.0.exe"
          if (-not (Test-Path $setup)) { throw "the installer was not produced" }
          # /? exits 0 and prints the switch list: the binary runs and is a real Setup.
          $size = (Get-Item $setup).Length
          if ($size -lt 5MB) { throw "the installer is only $size bytes; the payload is missing" }
          Write-Host "installer: $([math]::Round($size / 1MB, 1)) MB"
          # Not signed yet (P16.8a needs the EV certificate); say so rather than imply it is.
          $sig = Get-AuthenticodeSignature $setup
          Write-Host "signature: $($sig.Status)"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\TallyAgent -DestinationPath dist\TallyAgent-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tally-agent-windows-x64
          path: |
            dist/TallyAgent-windows-x64.zip
            dist/TallyAgent-Setup-*.exe
          retention-days: 30
