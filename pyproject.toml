[project]
name = "tally-platform"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["shared", "backend", "agent", "tools"]

[tool.uv.sources]
tally-contract = { workspace = true }
tally-backend = { workspace = true }
tally-agent = { workspace = true }
tally-tools = { workspace = true }

[dependency-groups]
# The Windows Agent build only (agent-build workflow, D-043 #3); not installed by default.
build = ["pyinstaller"]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "coverage",
  "time-machine",
  "hypothesis",
  "import-linter",
  "httpx",
  "types-pyyaml",
  "types-psutil",
  "trustme",  # a throwaway CA for the Agent's TLS tests (D-042 #4)
  "locust",  # PERF-1.1 under concurrency (P16.5); nothing else measures more than one user
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
# T20: no print() anywhere, tests included (CLAUDE.md "Testing and logs")
# PLW1514: text I/O must name its encoding - Windows defaults to cp1252 and the
# Agent ships to Windows machines.
# S: flake8-bandit, the security linter P16.2 owes (SEC-1.14). Ruff reimplements it, so it
# rides `make lint` instead of being a second tool and a second CI step.
preview = true  # PLW1514 is a preview rule
select = ["E", "F", "I", "UP", "B", "T20", "PLW1514", "S"]
# S101: `assert` in shipped code is used only for invariants mypy cannot see
# (`assert url is not None  # guaranteed by Settings validation`), never to validate untrusted
# input - that is Pydantic's job on every request body (SEC-1.10). Nothing runs under -O.
# S105/S106: flake8-bandit matches variable NAMES, so it flags TOKEN_PREFIX, token_type, the
# gate status PASS and the error code PASSWORD_CHANGE_REQUIRED. All constants, no secrets; the
# real check is gitleaks in CI.
# S311: `random` is used for retry jitter and generated test data, never for anything secret -
# tokens and credentials use `secrets` (app/core/security.py, agent secret store).
# S314/S405: xml.etree parses TallyPrime's reports. External entities are not resolved (proven
# in shared/tests/parser/test_parser.py) and a document declaring a DTD is refused outright,
# so the entity-expansion class is closed without taking on defusedxml.
ignore = ["S101", "S105", "S106", "S311", "S314", "S405"]

[tool.ruff.lint.per-file-ignores]
# S101 assert: what a test is made of. S105/S106/S311: fake secrets, random test data.
# S404/S603/S607 subprocess: tests and tools run tools with a literal argv, no shell, no
# request data. S310 urlopen: the mock-Tally tests call their own http://127.0.0.1 server.
# S608 "SQL built from a string": tests and tools build DDL from hardcoded table names;
# backend/tests/core/test_sql_is_parameterized.py is the real gate for shipped code, and it
# scans only what ships.
"**/tests/**" = ["S101", "S105", "S106", "S310", "S311", "S404", "S603", "S607", "S608"]
"tools/tally_tools/*" = ["S404", "S603", "S607", "S608"]
"backend/alembic/env.py" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "app.core.permissions.require"]

[tool.ruff.lint.isort]
known-first-party = ["tally_contract", "app", "tally_agent", "tally_tools", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["shared/tally_contract", "backend/app", "agent/tally_agent", "tools/tally_tools"]
mypy_path = "shared:backend:agent:tools"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# APScheduler 3.x and WeasyPrint ship no type information.
module = ["apscheduler.*", "weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Locust's event decorators are untyped, so mypy calls anything they decorate untyped too. The
# load test is one file of hooks; disabling the one rule there beats a blanket `Any`.
module = ["tally_tools.loadtest.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# strict for the contract package and backend core (P0.5)
module = ["tally_contract.*", "app.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["shared/tests", "backend/tests", "agent/tests", "tools/tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
# backend/ on the path so tests can `from tests.factories import ...` (CLAUDE.md).
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# xunit1: the only family that supports record_property, which carries req() IDs into the XML
junit_family = "xunit1"
# Capture DEBUG logs; pytest prints them for every failing test.
log_level = "DEBUG"
log_format = "%(asctime)s %(levelname)-8s %(name)s %(message)s"
markers = [
  "req(*ids): requirement / acceptance-criteria IDs this test FULLY proves, e.g. req('SYNC-3.2', 'AC-06')",
  "req_partial(*ids): IDs this test proves only part of; never counted as covered",
]

[tool.coverage.run]
source = ["tally_contract", "app", "tally_agent", "tally_tools"]
branch = true

[tool.coverage.report]
omit = ["*/tests/*"]

[tool.importlinter]
root_packages = ["app", "tally_contract", "tally_agent", "anthropic", "mcp"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Analytics, reconciliation, sync and exports never touch AI (SRS 2.4-1, NFR-REL-1)"
type = "forbidden"
source_modules = ["app.analytics", "app.reconciliation", "app.sync", "app.exports"]
forbidden_modules = ["app.anomaly", "anthropic", "mcp"]

[[tool.importlinter.contracts]]
# The other half: nothing that computes a figure or serves a request may reach the AI, so the
# feature flag stays the only switch (FR-3.1, AC-55). It caught app.api importing the system
# prompt from the explainer, which is why the prompt lives in its own SDK-free module.
# app.jobs is deliberately absent: app/jobs/anomaly.py is the one legitimate caller of the
# explainer - it is what runs the feature - and it imports it inside the function, so with the
# flag off nothing loads (tested behaviourally in tests/anomaly).
name = "Only app.anomaly may import the AI SDKs (SRS 12.2, FR-3.1)"
type = "forbidden"
source_modules = [
  "app.analytics",
  "app.api",
  "app.core",
  "app.exports",
  "app.models",
  "app.reconciliation",
  "app.schemas",
  "app.services",
  "app.sync",
]
forbidden_modules = ["anthropic", "mcp"]

[[tool.importlinter.contracts]]
name = "tally_contract does not import app or tally_agent"
type = "forbidden"
source_modules = ["tally_contract"]
forbidden_modules = ["app", "tally_agent"]

[[tool.importlinter.contracts]]
name = "tally_agent does not import app"
type = "forbidden"
source_modules = ["tally_agent"]
forbidden_modules = ["app"]
